          <input id="note" class="mt-1 block w-full rounded-md border-gray-300 p-2" />

const productArea = document.getElementById('product-area');
const select = document.getElementById('productSelect');

products.forEach(p => {
  const card = document.createElement('div');
  card.className = "bg-white border rounded-lg p-3 flex flex-col items-center";
  card.innerHTML = '<img src="'+p.image+'" alt="'+p.name+'" class="w-full h-44 object-cover rounded mb-2" />' +
                    '<h3 class="font-semibold text-sm">'+p.name+'</h3>' +
                    '<p class="text-xs text-gray-600">'+p.desc+'</p>' +
                    '<p class="mt-2 font-bold">'+p.price+'</p>';
  productArea.appendChild(card);
  const opt = document.createElement('option');
  opt.value = p.id;
  opt.text = p.name + " — " + p.price;
  select.appendChild(opt);
});

const form = document.getElementById('orderForm');
const submitBtn = document.getElementById('submitBtn');
const loading = document.getElementById('loading');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  loading.classList.remove('hidden');
  msg.textContent = "";

  const payload = {
    product: select.options[select.selectedIndex].text,
    product_id: select.value,
    name: document.getElementById('name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    address: document.getElementById('address').value.trim(),
    quantity: document.getElementById('quantity').value,
    note: document.getElementById('note').value.trim(),
    source: "TikTok"
  };

  try {
    const res = await fetch('/.netlify/functions/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.status === 'success') {
      msg.className = 'text-green-600';
      msg.textContent = '✅ تم استلام طلبك! سنتواصل معك قريبًا.';
      form.reset();
    } else {
      throw new Error(data.message || 'خطأ أثناء الحفظ');
    }
  } catch (err) {
    msg.className = 'text-red-600';
    msg.textContent = '❌ حدث خطأ أثناء الإرسال. حاول مرة أخرى.';
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    loading.classList.add('hidden');
  }
});
</script>
